apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo4-deployment
  labels:
    app: demo4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo4
  template:
    metadata:
      labels:
        app: demo4
    spec:
      containers:
      - name: demo4-app
        image: DEIN_DOCKERHUB_NUTZER/demo4-app:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: demo4-service
spec:
  type: NodePort
  selector:
    app: demo4
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30001
